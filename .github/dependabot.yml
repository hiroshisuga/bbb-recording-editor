version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    # Monitor the BBB Tldraw package without opening unrelated version updates.
    allow:
      - dependency-name: "@bigbluebutton/tldraw"
    open-pull-requests-limit: 1
